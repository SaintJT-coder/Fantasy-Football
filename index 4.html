<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GridIron Fantasy Football</title>
<meta name="description" content="Snake drafts, live scoring, waivers, trades and season recaps. A fantasy football app you can host on GitHub Pages.">
<meta name="theme-color" content="#090e1b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1528'/%3E%3Cpath d='M12 44c0-14 10-24 28-26l6 6c-2 18-12 28-26 28z' fill='%23ffd23f'/%3E%3Cpath d='M24 40l14-14M28 44l14-14' stroke='%230e1528' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== GridIron design tokens. Every colour, radius, shadow and duration lives here. ===== */
:root{
  --bg:#090e1b;--bg-2:#0e1528;--surface:#121b33;--surface-2:#1a2547;--surface-3:#223059;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);
  --text:#eef1f8;--muted:#93a0bd;
  --accent:#ffd23f;--accent-ink:#1b1500;--accent-text:#ffd23f;--accent-soft:rgba(255,210,63,.14);
  --good:#3fdc9a;--warn:#ff9f43;--bad:#ff5d6c;--info:#5aa7ff;
  --pos-QB:#ff5d6c;--pos-RB:#3fdc9a;--pos-WR:#5aa7ff;--pos-TE:#ff9f43;--pos-K:#a78bfa;--pos-DST:#94a3b8;
  --tier-0:#ffd23f;--tier-1:#3fdc9a;--tier-2:#5aa7ff;--tier-3:#ff9f43;--tier-4:#a78bfa;--tier-5:#94a3b8;
  --turf-1:#12402b;--turf-2:#164a31;--chalk:rgba(255,255,255,.55);
  --on-color:#fff;--overlay:rgba(4,8,18,.72);--qr-bg:#fff;
  --r-s:8px;--r-m:14px;--r-l:22px;--r-pill:999px;
  --shadow:0 10px 30px rgba(0,0,0,.42);--shadow-lift:0 20px 44px rgba(0,0,0,.6);
  --t-fast:150ms;--t-med:220ms;--ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2efe5;--bg-2:#e9e5d7;--surface:#fffdf7;--surface-2:#f4f0e3;--surface-3:#e8e3d1;
  --line:rgba(16,22,36,.12);--line-2:rgba(16,22,36,.24);--text:#101624;--muted:#566079;
  --accent:#f2b705;--accent-ink:#1b1500;--accent-text:#7d5700;--accent-soft:rgba(242,183,5,.2);
  --good:#0b8f5b;--warn:#b85f00;--bad:#d1243a;--info:#1568d3;
  --pos-QB:#d1243a;--pos-RB:#0b8f5b;--pos-WR:#1568d3;--pos-TE:#b85f00;--pos-K:#6a4bd6;--pos-DST:#56637a;
  --tier-0:#c28f00;--tier-1:#0b8f5b;--tier-2:#1568d3;--tier-3:#b85f00;--tier-4:#6a4bd6;--tier-5:#56637a;
  --turf-1:#2f7d4f;--turf-2:#36885a;--shadow:0 8px 24px rgba(40,34,10,.16);--shadow-lift:0 18px 40px rgba(40,34,10,.28);--overlay:rgba(16,22,36,.5);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2efe5;--bg-2:#e9e5d7;--surface:#fffdf7;--surface-2:#f4f0e3;--surface-3:#e8e3d1;
  --line:rgba(16,22,36,.12);--line-2:rgba(16,22,36,.24);--text:#101624;--muted:#566079;
  --accent:#f2b705;--accent-ink:#1b1500;--accent-text:#7d5700;--accent-soft:rgba(242,183,5,.2);
  --good:#0b8f5b;--warn:#b85f00;--bad:#d1243a;--info:#1568d3;
  --pos-QB:#d1243a;--pos-RB:#0b8f5b;--pos-WR:#1568d3;--pos-TE:#b85f00;--pos-K:#6a4bd6;--pos-DST:#56637a;
  --tier-0:#c28f00;--tier-1:#0b8f5b;--tier-2:#1568d3;--tier-3:#b85f00;--tier-4:#6a4bd6;--tier-5:#56637a;
  --turf-1:#2f7d4f;--turf-2:#36885a;--shadow:0 8px 24px rgba(40,34,10,.16);--shadow-lift:0 18px 40px rgba(40,34,10,.28);--overlay:rgba(16,22,36,.5);color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--font-body)}
body{min-height:100dvh;overflow-x:hidden}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.2px;line-height:1.05}
h2{font-size:28px}h3{font-size:21px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.sp{height:14px}.sp-s{height:8px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack>*+*{margin-top:12px}
.right{margin-left:auto}

/* ===== Layout shell ===== */
#app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100dvh}
#side{display:none}
#col{min-width:0;width:100%;max-width:680px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
#top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);transition:color var(--t-fast)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent-text)}
.tab.on svg{stroke-width:2.4}
.brand{font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.5px;line-height:1}
.brand i{font-style:normal;color:var(--accent-text)}
.lh{min-width:0}.lh b{display:block;font-family:var(--font-display);font-size:21px;line-height:1.05}
.lh .row{gap:5px;margin-top:3px;flex-wrap:wrap}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-pill);color:var(--muted);position:relative;flex:none}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:22px;height:22px}
.dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
main{padding-top:16px;outline:none}
@media(min-width:960px){
  #app{grid-template-columns:232px minmax(0,1fr)}
  #side{display:flex;flex-direction:column;gap:6px;padding:22px 14px;position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);background:var(--bg-2)}
  #side .brand{padding:0 12px 18px;font-size:30px}
  #side .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:48px;font-size:16px;border-radius:var(--r-m)}
  #side .tab.on{background:var(--surface);}
  #tabs{display:none}
  #col{max-width:1120px;padding:0 30px 60px}
  #top{margin:0 -30px;padding-left:30px;padding-right:30px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .cols.wide-l{grid-template-columns:1.25fr 1fr}
  .sheet{left:50%!important;right:auto!important;transform:translateX(-50%);width:560px;border-radius:var(--r-l)!important;bottom:5vh!important;max-height:88vh!important}
}

/* ===== Components ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.card+.card,.card+.cards{margin-top:10px}
.card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.card.flat{background:transparent}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-h h3{flex:1}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line-2);font-weight:700;font-size:16px;transition:transform var(--t-fast) var(--ease),background var(--t-fast);text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-2);font-weight:600;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-size:12px;opacity:.8}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:calc(var(--r-m) - 4px);font-weight:700;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--surface-3);color:var(--text);line-height:1.5;white-space:nowrap}
.badge.accent{background:var(--accent);color:var(--accent-ink)}
.badge.good{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.badge.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.badge.info{background:color-mix(in srgb,var(--info) 20%,transparent);color:var(--info)}
.badge.mute{background:var(--surface-3);color:var(--muted)}
.pt{display:inline-block;min-width:30px;text-align:center;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.pos-QB{--pc:var(--pos-QB)}.pos-RB{--pc:var(--pos-RB)}.pos-WR{--pc:var(--pos-WR)}.pos-TE{--pc:var(--pos-TE)}.pos-K{--pc:var(--pos-K)}.pos-DST{--pc:var(--pos-DST)}.pos-FLEX,.pos-SF{--pc:var(--accent-text)}
.av{position:relative;flex:none;width:var(--sz,44px);height:var(--sz,44px);border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:var(--on-color);font-family:var(--font-display);font-weight:800;font-size:calc(var(--sz,44px)*.4);text-shadow:0 1px 3px rgba(0,0,0,.55);border:2px solid var(--line-2)}
.av .tag{position:absolute;right:-6px;bottom:-4px;font-family:var(--font-body);font-size:10px;font-weight:800;line-height:1;padding:3px 5px;border-radius:6px;text-shadow:none;border:2px solid var(--surface);white-space:nowrap}
.tag.inj{background:var(--bad);color:#fff}.tag.bye{background:var(--muted);color:var(--bg)}.tag.q{background:var(--warn);color:#1b1500}
.meter{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:inherit;background:var(--mc,var(--accent));transition:width .6s var(--ease)}
.tone-good{--mc:var(--good)}.tone-warn{--mc:var(--warn)}.tone-bad{--mc:var(--bad)}.tone-accent{--mc:var(--accent)}.tone-info{--mc:var(--info)}
.spark{display:block;overflow:visible}
.field{position:relative}
label.lbl{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
.in{width:100%;min-height:50px;padding:0 14px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);outline:0;font-size:17px}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.in.code{text-align:center;letter-spacing:10px;font-family:var(--font-display);font-size:34px;font-weight:800;text-transform:uppercase}
.search{position:relative}.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;color:var(--muted)}.search .in{padding-left:42px}
input[type=range]{width:100%;accent-color:var(--accent);height:44px}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.toggle:last-child{border-bottom:0}
.toggle .sw{margin-left:auto;width:50px;height:30px;border-radius:var(--r-pill);background:var(--surface-3);position:relative;transition:background var(--t-fast);flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform var(--t-fast) var(--ease)}
.toggle[aria-checked=true] .sw{background:var(--accent)}
.toggle[aria-checked=true] .sw::after{transform:translateX(20px);background:var(--accent-ink)}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;min-height:56px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line-2);font-size:22px;font-weight:700}
.stepper output{min-width:52px;text-align:center;font-weight:800;font-size:18px}

/* hero + big numbers */
.hero{position:relative;overflow:hidden;border-radius:var(--r-l);padding:26px 20px 22px;background:linear-gradient(160deg,var(--turf-1),var(--turf-2) 60%,var(--bg-2));border:1px solid var(--line-2);color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.07) 46px 48px);pointer-events:none}
.hero h1{position:relative;font-size:54px;font-weight:900;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{position:relative;max-width:30ch;margin-top:8px;opacity:.9}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);min-height:96px}
.tile.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;grid-column:1/-1;min-height:84px}
.tile b{font-family:var(--font-display);font-size:23px;line-height:1}
.tile span{font-size:14px;opacity:.8}
.tile svg{width:24px;height:24px}
.score-big{font-family:var(--font-display);font-weight:900;font-size:56px;line-height:.9}
.h-num{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}

/* skeleton, empty, error */
.skel{border-radius:var(--r-m);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-3) 50%,var(--surface) 70%);background-size:300% 100%;animation:shimmer 1.2s linear infinite;height:64px;margin-bottom:10px}
.skel.s{height:22px;width:60%}.skel.l{height:140px}
.empty{text-align:center;padding:34px 18px;border:1px dashed var(--line-2);border-radius:var(--r-m)}
.empty svg{width:40px;height:40px;color:var(--muted)}
.empty h3{margin:10px 0 4px}.empty p{color:var(--muted);max-width:34ch;margin:0 auto 14px}
.errbox{border:1px solid var(--bad);border-radius:var(--r-m);padding:18px;text-align:center;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.errbox p{color:var(--muted);margin:6px 0 12px}

/* sheets, modal, toast */
#sheet .scrim,#modal .scrim{position:fixed;inset:0;background:var(--overlay);z-index:60;animation:fade var(--t-fast)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90dvh;overflow:auto;background:var(--bg-2);border-radius:var(--r-l) var(--r-l) 0 0;border:1px solid var(--line-2);border-bottom:0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp var(--t-med) var(--ease);overscroll-behavior:contain}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:4px auto 14px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:71;width:min(92vw,400px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow-lift);animation:popIn var(--t-med) var(--ease)}
#modal .scrim{z-index:70}
.modal h3{margin-bottom:8px}.modal p{color:var(--muted);margin-bottom:18px}
.modal .row .btn{flex:1}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(12px + env(safe-area-inset-top,0px));transform:translateY(-160%);z-index:90;max-width:min(92vw,460px);padding:12px 16px;background:var(--surface-3);border:1px solid var(--line-2);border-radius:var(--r-m);box-shadow:var(--shadow);font-weight:600;transition:transform var(--t-med) var(--ease);display:flex;gap:12px;align-items:center}
#toast.on{transform:translateY(0)}
#toast button{color:var(--accent-text);font-weight:800;min-height:44px;padding:0 6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100;width:100%;height:100%}

/* ===== Draft: play clock ===== */
.clockp{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r-l);background:linear-gradient(150deg,var(--surface-2),var(--surface));border:1px solid var(--line-2);position:relative;overflow:hidden}
.clockp.me{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.ring{position:relative;width:108px;height:108px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--surface-3)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .3s}
.ring.warn .fg{stroke:var(--warn)}.ring.bad .fg{stroke:var(--bad)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:44px;font-variant-numeric:tabular-nums}
.ring.bad .t{color:var(--bad)}
.ring.pulse{animation:pulse .9s ease-in-out infinite}
.otc b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.05}
.last-pick{margin-top:10px;padding:10px 12px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.last-pick.pop{animation:popIn .45s var(--ease)}

/* player rows */
.tier{display:flex;align-items:center;gap:10px;margin:16px 2px 8px;color:var(--tc);font-family:var(--font-display);font-weight:800;font-size:19px}
.tier::before{content:"";width:6px;height:20px;border-radius:3px;background:var(--tc)}
.tier::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--tc),transparent)}
.sw{position:relative;margin-bottom:8px;border-radius:var(--r-m);overflow:hidden;background:var(--surface-3)}
.sw-bg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 18px;font-weight:800;opacity:0}
.sw-bg.l{left:0;color:var(--good)}.sw-bg.r{right:0;color:var(--muted)}
.pc{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:64px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.pc.back{transition:transform .25s var(--ease)}
.pc-m{flex:1;min-width:0}
.pc-m b{display:flex;align-items:center;gap:6px;font-size:16px;line-height:1.2}
.pc-m b>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-m>span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.pc-r{text-align:right;flex:none}
.pc-r b{display:block;font-family:var(--font-display);font-size:25px;line-height:1}
.pc-r span{font-size:12px;color:var(--muted)}
.qd{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:var(--r-pill)}
.filters{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding:8px 0 4px;margin:0 -2px}

/* board */
.board-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);max-height:70dvh}
table.board{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.board th{position:sticky;top:0;z-index:2;background:var(--surface-2);padding:8px 4px;min-width:84px;font-weight:700;border-bottom:1px solid var(--line)}
.board th:first-child,.board td:first-child{position:sticky;left:0;z-index:3;min-width:46px;background:var(--surface-2);text-align:center}
.board th.me{color:var(--accent-text)}
.board td{padding:5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:56px;vertical-align:middle;line-height:1.2;background:var(--surface)}
.board td.bc{border-left:4px solid var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface))}
.board td b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:88px}
.board td i{font-style:normal;color:var(--muted)}
.board td.empty-c{color:var(--muted);text-align:center}
.board td.cur{box-shadow:inset 0 0 0 2px var(--accent);animation:glow 1.4s ease-in-out infinite}
.board td.newp{animation:popIn .5s var(--ease)}
.board .k{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:9px;padding:1px 4px;border-radius:4px;margin-left:3px}
.board .qq{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:9px;padding:1px 5px;border-radius:var(--r-pill);margin-bottom:2px}

/* queue / sortable */
.qrow{display:flex;align-items:center;gap:10px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:8px;position:relative}
.qrow.lift,.slotc.lift{box-shadow:var(--shadow-lift);z-index:50;transition:none;border-color:var(--accent);transform:scale(1.02)}
.qrow.drop-before::before{content:"";position:absolute;left:0;right:0;top:-6px;height:3px;border-radius:2px;background:var(--accent)}
.slotc.drop-over{outline:3px solid var(--accent);outline-offset:2px;background:var(--accent-soft)}
.grip{width:36px;height:48px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.grip svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ghost{position:fixed;z-index:200;pointer-events:none;box-shadow:var(--shadow-lift);border:1px solid var(--accent);transform:scale(1.04) rotate(-1deg);opacity:.96}

/* roster field */
.pitch{position:relative;border-radius:var(--r-l);padding:12px;background:repeating-linear-gradient(0deg,var(--turf-1) 0 52px,var(--turf-2) 52px 104px);border:1px solid var(--line-2);overflow:hidden}
.pitch::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(255,255,255,.12) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px));pointer-events:none}
.prow{position:relative;z-index:1;display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px;margin-bottom:8px}
.prow:last-child{margin-bottom:0}
.slotc{position:relative;display:flex;align-items:center;gap:8px;padding:8px;min-height:76px;border-radius:var(--r-m);background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line-2);transition:transform var(--t-med) var(--ease),box-shadow var(--t-med);backdrop-filter:blur(2px)}
.slotc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.slotc.empty-s{border-style:dashed;color:var(--muted)}
.slotc .sl{position:absolute;top:-1px;left:-1px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:var(--r-m) 8px 8px 8px;background:var(--pc,var(--surface-3));color:var(--on-color)}
.slotc .body{flex:1;min-width:0;padding-top:8px;text-align:left}
.slotc .body b{display:block;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slotc .body span{font-size:12px;color:var(--muted)}
.slotc .pr{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1;text-align:right}
.slotc .grip{width:28px;height:44px}
.conf{display:flex;align-items:center;gap:6px;margin-top:4px;min-height:44px;margin-bottom:-14px;margin-top:-6px}
.conf .meter{flex:1;height:6px}
.confr{font-size:12px;color:var(--muted);padding:2px 4px 0}
.bench{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}
.bench .slotc{flex:none;width:168px;scroll-snap-align:start}
.bench .slotc .sl{background:var(--surface-3);color:var(--muted)}
.alert{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-m);background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);margin-bottom:10px}

/* matchup */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .tm{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .tm b{font-size:15px;line-height:1.15;max-width:100%}
.vs .score{font-family:var(--font-display);font-weight:900;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.vs .score.win{color:var(--good)}
.flash{animation:flash .8s ease-out}
.pbar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.pbar .meter{height:12px}
.pbar .meter:first-child>i{margin-left:auto;display:block}
.pbar .meter:first-child{direction:rtl}
.mrow{display:grid;grid-template-columns:1fr 46px 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .l{text-align:left}.mrow .r{text-align:right}
.mrow .nm{font-weight:700;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sub{font-size:12px;color:var(--muted)}
.mrow .pts{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.mrow .mid{text-align:center}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1s infinite}
.delta{font-size:12px;font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.arrow{display:inline-flex;vertical-align:-2px}.arrow svg{width:14px;height:14px}
.playing{background:linear-gradient(90deg,transparent,var(--accent-soft),transparent)}
.playing .pts{color:var(--accent-text)}

/* trade meter */
.tmeter{display:flex;height:14px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-3)}
.tmeter i{display:block;height:100%;transition:width .4s var(--ease)}
.tmeter .a{background:var(--bad)}.tmeter .b{background:var(--good)}
.pick-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-m);border:1px solid var(--line);margin-bottom:6px;min-height:56px;width:100%;text-align:left;background:var(--surface)}
.pick-row.on{border-color:var(--accent);background:var(--accent-soft)}
.pick-row .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;flex:none}
.pick-row.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick-row .ck svg{width:15px;height:15px;stroke-width:3}

/* feed + chat */
.feed{position:relative;padding-left:14px}
.feed::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--line)}
.fi{position:relative;display:flex;gap:12px;padding:10px 0}
.fi .ico{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);flex:none;border:2px solid var(--bg)}
.fi .ico svg{width:19px;height:19px}
.fi.t-trade .ico{background:color-mix(in srgb,var(--info) 25%,var(--bg-2));color:var(--info)}
.fi.t-add .ico{background:color-mix(in srgb,var(--good) 25%,var(--bg-2));color:var(--good)}
.fi.t-drop .ico{background:color-mix(in srgb,var(--bad) 25%,var(--bg-2));color:var(--bad)}
.fi.t-pick .ico{background:var(--accent-soft);color:var(--accent-text)}
.fi p{font-size:15px;line-height:1.3}
.rxs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rx{position:relative;min-height:44px;min-width:44px;padding:0 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);font-size:15px;display:inline-flex;align-items:center;gap:4px}
.rx.on{border-color:var(--accent);background:var(--accent-soft)}
.rx b{font-size:13px}
.burst{position:absolute;left:50%;top:50%;font-size:16px;pointer-events:none;animation:burst .7s ease-out forwards;z-index:5}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;border-color:transparent}
.msg small{display:block;opacity:.7;font-size:11px;font-weight:700}
.compose{display:flex;gap:8px;position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding-top:10px}
@media(min-width:960px){.compose{bottom:12px}}

/* standings, bracket, power */
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-size:12px;color:var(--muted);text-align:right;padding:6px 6px;font-weight:700}
.tbl td{padding:10px 6px;border-top:1px solid var(--line);text-align:right}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl tr.me td{background:var(--accent-soft)}
.tbl td:first-child,.tbl th:first-child{text-align:center;width:30px;padding-left:2px;padding-right:2px;color:var(--muted)}
.bracket{display:flex;gap:26px;overflow-x:auto;padding:10px 4px 16px;align-items:center;scroll-snap-type:x proximity}
.bcol{display:flex;flex-direction:column;gap:22px;min-width:178px;justify-content:space-around;scroll-snap-align:start}
.bcol h4{font-family:var(--font-display);font-size:16px;color:var(--muted)}
.bm{position:relative;border:1px solid var(--line-2);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.bm.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bm .bt{display:flex;align-items:center;gap:8px;padding:8px 10px;min-height:44px;font-size:14px}
.bm .bt+.bt{border-top:1px solid var(--line)}
.bm .bt.w{font-weight:800}.bm .bt.l{color:var(--muted)}
.bm .bt.me{background:var(--accent-soft)}
.bm .bt .num{margin-left:auto;font-weight:700}
.bm::after{content:"";position:absolute;left:100%;top:50%;width:26px;height:2px;background:var(--line-2)}
.bcol:last-child .bm::after{display:none}
.bm.mine::after{background:var(--accent)}
.rankn{font-family:var(--font-display);font-weight:900;font-size:28px;width:34px;text-align:center;flex:none}

/* reveal + wrapped + grade */
#overlay .ov{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-width:760px;margin:16px auto 30px}
#overlay .ov .row{position:relative;z-index:5}
.flip{perspective:800px;height:108px}
.flip>div{position:relative;width:100%;height:100%;transition:transform .7s var(--ease);transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-m);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.flip .b{background:repeating-linear-gradient(45deg,var(--surface-2) 0 10px,var(--surface-3) 10px 20px);border:1px solid var(--line-2);font-family:var(--font-display);font-size:30px;color:var(--muted)}
.flip .f{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line-2)}
.flip.me .f{border-color:var(--accent);background:var(--accent-soft)}
.flip .f .n{font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1;color:var(--accent-text)}
.flip .f b{font-size:12px;line-height:1.1}
.flip.pulse>div{animation:pulse .5s}
.wrap-x{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:6px 0 14px;-webkit-overflow-scrolling:touch}
.wcard{flex:none;width:min(86vw,380px);min-height:min(66dvh,520px);scroll-snap-align:center;border-radius:var(--r-l);padding:26px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(155deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.wcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.06) 46px 48px)}
.wcard>*{position:relative}
.wcard .big{font-family:var(--font-display);font-weight:900;font-size:92px;line-height:.9}
.wcard .btn{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);color:#fff}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-3)}.dots i.on{background:var(--accent)}
.grade{font-family:var(--font-display);font-weight:900;font-size:76px;line-height:.85;width:96px;text-align:center;flex:none}
.grade.A{color:var(--good)}.grade.B{color:var(--info)}.grade.C{color:var(--warn)}.grade.D{color:var(--bad)}
.steps{display:flex;align-items:center;margin:4px 0 16px}
.step{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:800}
.step.on{color:var(--text)}.step.on i{background:var(--accent);color:var(--accent-ink)}
.step.done i{background:var(--good);color:#04180e}
.steps hr{flex:1;border:0;height:2px;background:var(--line-2);margin:0 8px}
.bars svg{width:100%;height:auto}
.pcard h2{font-size:32px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:8px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:24px;line-height:1.05}.stat span{font-size:11px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:center;font-weight:700}
.cmp .lbl2{font-size:12px;color:var(--muted);font-weight:600}
.cmp .win{color:var(--good);font-weight:900}.cmp .win::before{content:"\25CF  ";font-size:8px;vertical-align:2px}
.qrbox{display:grid;place-items:center;padding:14px;background:var(--qr-bg);border-radius:var(--r-m);width:fit-content;margin:0 auto}
.codebig{font-family:var(--font-display);font-weight:900;font-size:52px;letter-spacing:10px;text-align:center;color:var(--accent-text)}

/* ===== Motion ===== */
@keyframes fade{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
@keyframes popIn{from{transform:translateY(14px) scale(.95);opacity:0}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes glow{50%{box-shadow:inset 0 0 0 2px var(--accent),0 0 16px var(--accent-soft)}}
@keyframes flash{0%{color:var(--accent-text);transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
.lcard{width:100%;text-align:left;display:flex;align-items:center;gap:12px;min-height:72px;margin-bottom:10px}
.lcard .flipx{width:20px;height:20px;transform:scaleX(-1);color:var(--muted)}
.card+.lcard{margin-top:0}
.board td[data-act]{cursor:pointer}

.av-btn{flex:none;min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:50%}
.slotw{min-width:0}
.conf{width:100%;text-align:left}
.conf .num{min-width:22px;text-align:right}
.slotc .grip{width:24px}
.seg.sm button{min-height:44px;font-size:14px}
.tcol{flex:1;min-width:0}
.tcol h4{font-family:var(--font-display);font-size:16px;color:var(--muted);margin-bottom:4px}
.tline{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;min-height:44px}
.flipx{transform:scaleX(-1)}
.brow{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.brow .bb{display:grid;gap:4px}.brow .bb .meter{height:7px}
.brow .bn b{display:block;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bd{text-align:right;font-weight:800}
.brow .meter.before{opacity:.55}

/* roster slot cards: stacked layout so names fit on a phone */
.slotc{display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:22px 10px 0;min-height:0}
.slotc .sr1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.slotc .body{flex:none;padding-top:2px;text-align:left;min-width:0}
.slotc .body b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.15;min-height:2.3em;font-size:15px}
.slotc .body span{display:flex;align-items:center;gap:6px;margin-top:2px}
.slotc .grip{position:absolute;top:0;right:0;width:40px;height:40px}
.slotc .pr{font-size:24px}
.conf{display:flex;align-items:center;gap:8px;margin:0;min-height:44px;width:100%}
.conf .meter{flex:1}
.slotc.empty-s{min-height:96px}
.bench .slotc{width:176px}
.slotc .grip{position:static;width:26px;height:44px;margin-left:-10px;margin-right:-4px}
.slotc{padding-top:20px}
.ghost{position:fixed!important;margin:0!important}
.slotc,.qrow,.pc,.ghost{user-select:none;-webkit-user-select:none}

</style>

<body>
<div id="app">
  <aside id="side" aria-label="Sidebar"></aside>
  <div id="col">
    <header id="top"></header>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav id="tabs" aria-label="Primary"></nav>
</div>
<div id="sheet"></div>
<div id="modal"></div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><p style="padding:24px">GridIron needs JavaScript turned on.</p></noscript>
<!-- engine.js holds the player data and all game rules. It must sit next to this file. -->
<script src="engine.js"></script>
<script>
(function () {
"use strict";
if (typeof GI === "undefined") { document.getElementById("main").innerHTML = '<div class="errbox"><h3>engine.js is missing</h3><p>Upload engine.js to the same folder as index.html on GitHub, then reload.</p></div>'; return; }
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const P = GI.P, PL = GI.PL;

/* draft driver: CPU picks, timeouts, autopilot, low-time buzz */

  let pick = null, auto = false, note = "";

  else if (mine && l.auto && l.auto[me] && el >= 1.2) { const r = GI.autoPickFor(l, c.team); pick = r.p; auto = true; note = r.fromQueue ? " from your queue" : " (autopilot)"; }
  else if (el >= l.timer) { const r = GI.autoPickFor(l, c.team); pick = r.p; auto = true; note = r.fromQueue ? " from your queue" : " (best available)"; }

/* ===== Season recap ("Wrapped") ===== */
const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
function recapCards(l, ti, r) {

  add({ kicker: "Your season", big: r.record, title: t.name, body: `${r.weeks} week${r.weeks > 1 ? "s" : ""} played, ${Math.round(r.pf)} total points.` });
  add({ kicker: "Where you finished", big: r.champion ? "CHAMPS" : "#" + r.rank, bigSize: r.champion ? 230 : 360, title: r.champion ? "League champion" : `${ord(r.rank)} of ${l.size}`, body: r.champion ? "You won it all. Frame the trophy." : r.rank === 1 ? "Top seed in the standings." : "Every week counts, and next season is a fresh start." });
  if (r.hi) add({ kicker: "Highest-scoring week", big: f1(r.hi.score), title: "Week " + r.hi.wk, body: `Your best output of the year, against ${nm(r.hi.opp)}.` });
  if (r.blow) add({ kicker: "Biggest blowout", big: f1(r.blow.margin), title: "Week " + r.blow.wk, body: `You beat ${nm(r.blow.opp)} ${f1(r.blow.me)} to ${f1(r.blow.op)}.` });
  if (r.lucky) add({ kicker: "Luckiest win", big: f1(r.lucky.me), title: "Week " + r.lucky.wk, body: `You won with ${f1(r.lucky.me)}, under that week's league median of ${f1(r.lucky.med)}. Take the win.` });
  else if (r.narrow) add({ kicker: "Closest win", big: f1(r.narrow.margin), title: "Week " + r.narrow.wk, body: `You edged ${nm(r.narrow.opp)} ${f1(r.narrow.me)} to ${f1(r.narrow.op)}.` });
  if (r.mvp) add({ kicker: "Team MVP", big: f1(r.mvp.pts), bigSize: 300, title: r.mvp.p.name, body: `${r.mvp.p.pos} · ${r.mvp.p.team}. Scored the most points in your starting lineup.` });

}

ACT.recap = () => {
  const l = L(), ti = myTi(l), r = GI.recap(l, ti); if (!r) return toast("Play at least one week to unlock your recap."); recapSpecs = recapCards(l, ti, r);
  $("#overlay").innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-label="Season recap"><div style="max-width:760px;margin:0 auto"><div class="row"><h2 class="grow">Your season</h2><button class="icon-btn" data-act="closeOverlay" aria-label="Close recap">${ic("x")}</button></div><p class="muted sm">Swipe through. Share any card as an image.</p><div class="sp-s"></div>
<div class="wrap-x" id="wx" tabindex="0" aria-label="Recap cards, swipe sideways">${recapSpecs.map((c, i) => `<article class="wcard" style="--c1:${c.c1};--c2:${c.c2}" aria-label="${esc(c.kicker)}"><div class="eyebrow" style="color:#fff;opacity:.85;font-size:15px">${esc(c.kicker)}</div><div><div class="big num" style="${c.bigSize && c.bigSize < 300 ? `font-size:${Math.round(c.bigSize * .26)}px` : ""}">${esc(c.big)}</div><h2 style="font-size:40px;margin-top:8px">${esc(c.title)}</h2><p style="margin-top:8px;opacity:.92">${esc(c.body)}</p></div>${Btn("Share as image", { act: "shareRecap", data: { i }, icon: "share" })}</article>`).join("")}</div>
<div class="dots" id="wd" aria-hidden="true">${recapSpecs.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div></div></div>`;
  document.body.classList.add("noscroll"); const w = $("#wx"); w && w.focus({ preventScroll: true });
};
ACT.closeOverlay = () => { $("#overlay").innerHTML = ""; if (!$("#sheet").innerHTML) document.body.classList.remove("noscroll"); };
ACT.shareRecap = d => shareCard(recapSpecs[+d.i]);
document.addEventListener("scroll", e => { const w = e.target; if (w && w.id === "wx") { const i = Math.round(w.scrollLeft / (w.firstElementChild.offsetWidth + 12)); $$("#wd i").forEach((x, k) => x.classList.toggle("on", k === i)); } }, true);

/* ===== Events + startup ===== */
ACT.closeSheet = () => closeSheet();
ACT.closeModal = () => closeModal();
ACT.confirmOk = () => { const cb = confirmCb; closeModal(); cb && cb(); };
document.addEventListener("click", e => { const a = e.target.closest("[data-act]"); if (!a || a.disabled) return; const f = ACT[a.dataset.act]; if (f) f(a.dataset, e); });
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.id === "chatin") { e.preventDefault(); ACT.chatSend(); }
  if (e.key === "Escape") { if ($("#modal").innerHTML) closeModal(); else if ($("#sheet").innerHTML) closeSheet(); else if ($("#overlay").innerHTML && !S.revealing) ACT.closeOverlay(); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return; let v = e.target.value;
  if (k === "me" || k === "name" || k === "team") S.form[k] = v;
  else if (k === "join") { v = v.toUpperCase().replace(/[^A-Z0-9]/g, ""); e.target.value = v; S.form.join = v; }
  else if (k === "adh") { S.form.adh = +v; $("#adhv").textContent = adhLabel(+v); }
  else if (k === "q") onSearch(v); else if (k === "wq") onWSearch(v);
  else if (k === "cq") { const cl = $("#cl"); if (cl && S.cmp) cl.innerHTML = cmpList(S.cmp.a, v); }
  else if (k === "chat") S.chatDraft = v; else if (k === "lname") S.lname = v;
  else if (k === "qfrom") { prefs.quiet.from = v; savePrefs(); } else if (k === "qto") { prefs.quiet.to = v; savePrefs(); }
});
window.addEventListener("storage", e => { if (e.key && e.key.startsWith("gi:L:")) { delete Svc.cache[e.key.slice(5)]; const a = document.activeElement; if (!(a && a.matches && a.matches("input,textarea")) && !$("#sheet").innerHTML) render({ keep: true }); } });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme); } catch (e) {}
applyTheme();
{ const m = /join=([A-Za-z0-9]{6})/.exec(location.hash || ""); if (m) { S.home = "join"; S.form.join = m[1].toUpperCase(); } }
render();

})();
</script>
